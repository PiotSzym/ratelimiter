[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-limiter"
version = "1.0.0"
description = "Token bucket rate limiter coded in Python"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Piotr Szymanski" }
]

[tool.setuptools.packages.find]
include = ["rate_limiter*"]